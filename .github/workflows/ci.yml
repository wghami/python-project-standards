# Required checks for the standards repository; mirrors template/.github/workflows/ci.yml
# plus a smoke job that renders the template and runs the rendered project's whole pipeline.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_LOCKED: "1" # every uv command fails if uv.lock is stale (CI-2)
  FORCE_COLOR: "1"

jobs:
  pre-commit-stage:
    name: hooks · pre-commit stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure
        env:
          SKIP: gitleaks # the secrets job scans the full history instead

  pre-push-stage:
    name: hooks · pre-push stage (tests, 100 % coverage, docs, contracts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
        env:
          STANDARDS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  commits:
    name: commits, PR title, branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run standards check-commits --range "origin/${BASE_REF}..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: uv run standards check-pr-title "${PR_TITLE}"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: uv run standards check-branch-name --name "${HEAD_REF}"
        env:
          HEAD_REF: ${{ github.head_ref }}

  smoke:
    name: render the template and run its pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: Render a sample project from this commit
        run: |
          uv run copier copy --quiet --trust --vcs-ref HEAD --defaults --skip-tasks \
            -d project_name=SmokeTest -d author_name=CI -d github_owner=wghami \
            -d description="Smoke test." . "${RUNNER_TEMP}/smoke"
      - name: Point the sample at this checkout of the CLI, lock, install
        working-directory: ${{ runner.temp }}/smoke
        env:
          UV_LOCKED: "0"
        run: |
          sed -i "s#^project-standards = .*#project-standards = { path = \"${GITHUB_WORKSPACE}\", editable = true }#" pyproject.toml
          git init -q -b main
          git config user.name ci && git config user.email ci@example.invalid
          uv lock --quiet && uv sync --quiet
          git add -A && git commit -q --no-verify -m "chore: render from template"
      - name: Run every hook stage on the rendered project
        working-directory: ${{ runner.temp }}/smoke
        env:
          SKIP: gitleaks
        run: |
          uv run pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure
          uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "${PWD}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run pip-audit --skip-editable --progress-spinner off

  badges:
    name: publish measured badges
    needs: [pre-push-stage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the badges branch only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Measure (from the gates' own reports)
        run: |
          uv run interrogate --fail-under 0 --ignore-private --ignore-semiprivate --ignore-magic --ignore-nested-functions src > interrogate.txt || true
          uv run standards badge coverage coverage.xml --out badges/coverage.json
          uv run standards badge docstrings interrogate.txt --out badges/docstrings.json
      - run: bash .github/scripts/publish-badges.sh badges
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: release (tag, build, SBOM, GitHub Release)
    needs: [pre-commit-stage, pre-push-stage, smoke, secrets, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the tag, create the release
      id-token: write # build provenance
      attestations: write
      issues: read # release blockers (CI-7)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: Refuse to release while a release-blocker issue is open (CI-7)
        run: |
          open=$(gh issue list --label release-blocker --state open --json number --jq length)
          if [ "${open}" != "0" ]; then
            echo "::error::${open} open release-blocker issue(s); fix them first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compute the next version from commits
        id: next
        run: |
          set +e
          next=$(uv run cz bump --get-next --yes 2>/dev/null)
          status=$?
          set -e
          if [ "${status}" = "0" ]; then
            echo "version=${next}" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" = "21" ] || [ "${status}" = "3" ]; then
            echo "No releasable commit since the last tag."
          else
            echo "::error::cz bump --get-next failed (${status})"; exit "${status}"
          fi
      - name: Tag and push
        if: steps.next.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "release v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Build, SBOM, release notes
        if: steps.next.outputs.version
        run: |
          uv build
          uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uv run cyclonedx-py requirements requirements.txt --output-file dist/sbom.cdx.json
          uv run cz changelog "v${VERSION}" --dry-run > release-notes.md
        env:
          VERSION: ${{ steps.next.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.next.outputs.version
        with:
          subject-path: dist/*
      - name: GitHub Release
        if: steps.next.outputs.version
        run: gh release create "v${VERSION}" dist/* --title "v${VERSION}" --notes-file release-notes.md --verify-tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Every releasable commit is tagged and published (VER-2)
        run: |
          git fetch --tags --quiet origin
          uv run standards check-version --remote origin --released
